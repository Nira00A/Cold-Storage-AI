services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cold_storage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cold_storage}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  edge:
    build:
      context: .
      dockerfile: edge_simulation/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      EDGE_DB_PATH: /data/edge_buffer.db
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-2}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-2}
      FAULT_EVERY_CYCLES: ${FAULT_EVERY_CYCLES:-20}
      FAULT_DURATION_CYCLES: ${FAULT_DURATION_CYCLES:-5}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - edge_data:/data

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
  edge_data:
